# The URL the site will be built for
base_url = "https://nrgking.github.io"

# The title of the site. This is required.
title = "nikrg"
description = "Nikhail's Portfolio"

# The name of the theme to use. This was moved from the [extra] section.
theme = "duckquill"

# Whether to automatically compile all Sass files in the sass directory
# Set this to `true` as most themes, including duckquill, require it.
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

[markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
highlight_code = true

[extra]
# Put all your custom variables here
default_theme = "light"
default_language = "en"
styles = ["mods.css"]

emoji_favicon = "🥁"

# Accent colors from the Duckquill demo
accent_color = "#ff7800"
accent_color_dark = "#ffa348"

[extra.nav]
# Whether to show the manual theme switcher in the nav
show_theme_switcher = false
# Whether to show the Atom/RSS feed button in the nav
show_feed = false
# Whether to show the link to the source repository in the nav
show_repo = false
# Links used in the nav.
# For local files use same link format as in Markdown,
# i.e. "@/blog/_index.md".
# See https://www.getzola.org/documentation/content/linking/#internal-links
links = [
    { url = "@/game-development/index.md", name = "Game Development" },
    { url = "@/robotics/index.md", name = "Robotics" },
    { url = "@/misc/index.md", name = "Miscellaneous" },

    { url = "https://drive.google.com/file/d/1Ztbv_M-Fi-nj6pE86VU52ridqszBqBwa/view?usp=sharing", name = "Resume" },
    { url = "https://github.com/NRGKing", name = "GitHub" },
]
